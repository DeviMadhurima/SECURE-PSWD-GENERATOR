<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Password Generator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>Secure Password Generator</h1>

  <label>Length:
    <input type="number" id="length" min="8" max="64" value="16">
  </label>
  <label><input type="checkbox" id="upper" checked> Uppercase</label>
  <label><input type="checkbox" id="lower" checked> Lowercase</label>
  <label><input type="checkbox" id="numbers" checked> Numbers</label>
  <label><input type="checkbox" id="symbols"> Symbols</label>

  <button id="generate">Generate</button>
  <pre id="output"></pre>

  <script>
    const LOWER = "abcdefghijklmnopqrstuvwxyz";
    const UPPER = LOWER.toUpperCase();
    const NUM = "0123456789";
    const SYM = "!@#$%^&*()-_=+[]{};:,.<>/?";

    const cryptoRand = (n) => {
      const arr = new Uint32Array(n);
      crypto.getRandomValues(arr);
      return arr;
    };

    function generatePassword(len, useUpper, useLower, useNum, useSym) {
      let pool = "";
      if (useUpper) pool += UPPER;
      if (useLower) pool += LOWER;
      if (useNum)   pool += NUM;
      if (useSym)   pool += SYM;
      if (!pool) return "Select at least one character set.";

      const rand = cryptoRand(len);
      let out = "";
      for (let i = 0; i < len; i++) {
        out += pool[rand[i] % pool.length];
      }
      return out;
    }

    document.getElementById("generate").onclick = () => {
      const len = parseInt(document.getElementById("length").value, 10);
      const pw = generatePassword(
        len,
        document.getElementById("upper").checked,
        document.getElementById("lower").checked,
        document.getElementById("numbers").checked,
        document.getElementById("symbols").checked
      );
      document.getElementById("output").textContent = pw;
    };

    // Register service worker for offline support
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
